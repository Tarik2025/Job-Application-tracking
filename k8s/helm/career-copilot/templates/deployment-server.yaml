apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "career-copilot.fullname" . }}-server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: career-copilot-server
  template:
    metadata:
      labels:
        app: career-copilot-server
    spec:
      containers:
        - name: server
          image: {{ .Values.server.image | quote }}
          ports:
            - containerPort: {{ .Values.server.port }}
          env:
            - name: NODE_ENV
              value: "production"
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          resources: {{ toYaml .Values.server.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "career-copilot.fullname" . }}-pvc
      {{- end }}
